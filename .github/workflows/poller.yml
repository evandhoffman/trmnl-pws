name: Poller CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "templates/**"
      - "go.mod"
      - "go.sum"
      - "poller.Dockerfile"
      - ".github/workflows/poller.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "templates/**"
      - "go.mod"
      - "go.sum"
      - "poller.Dockerfile"
      - ".github/workflows/poller.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt, go mod tidy, vet, staticcheck
        # Collect the status so that one run reports every problem.
        run: |
          status=0
          test -z "$(gofmt -l .)" || { gofmt -l .; status=1; }
          go mod tidy -diff || status=$?
          go vet ./... || status=$?
          go tool staticcheck ./... || status=$?
          exit "$status"

      - name: Tests (race detector)
        run: go test -race ./...

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      IMAGE: trmnl-poller:ci
      CONTAINER: trmnl-poller-smoke
    steps:
      - uses: actions/checkout@v7

      # The exact runtime target that publish pushes.
      - name: Build the image
        run: |
          docker build -f poller.Dockerfile --target runtime \
            --build-arg VERSION=${{ github.sha }} -t "$IMAGE" .

      - name: Smoke test, version
        run: |
          out=$(docker run --rm "$IMAGE" --version)
          echo "$out"
          test "$out" = "trmnl-poller ${{ github.sha }}"

      - name: Smoke test, the container boots and answers its healthcheck
        run: |
          docker run -d --name "$CONTAINER" \
            -e TRMNL_POLLER_KEY="$(openssl rand -hex 16)" "$IMAGE"
          # The runtime image has no shell: the healthcheck runs by exec.
          for i in $(seq 1 15); do
            if docker exec "$CONTAINER" /usr/local/bin/trmnl-poller healthcheck; then
              echo "healthy after ${i} tries"
              exit 0
            fi
            sleep 1
          done
          echo "::error::healthcheck did not pass in 15 tries"
          exit 1

      - name: Container logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs "$CONTAINER" || true

      - name: Remove the container
        if: always()
        run: docker rm -f "$CONTAINER" || true

  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 3
        with:
          context: .
          file: poller.Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/evandhoffman/trmnl-poller:${{ github.sha }}
            ghcr.io/evandhoffman/trmnl-poller:latest

  # Push the TRMNL templates. The push is idempotent, so it runs on every
  # qualifying push to main. Task 14 puts the first plugin id in
  # templates/plugins.yml; until then the tool skips every entry.
  templates:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install the trmnl CLI
        run: |
          go install github.com/usetrmnl/cli/cmd/trmnl@v0.1.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # A go install build prints "dev" for --version, so read the build info.
      - name: Check the CLI version
        run: go version -m "$(command -v trmnl)" | grep -E '^\s+mod\s+github.com/usetrmnl/cli\s+v0\.1\.1\b'

      # The tool puts both keys in the environment of the CLI only. It
      # never prints them.
      - name: Push the templates
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
          TRMNL_POLLER_KEY: ${{ secrets.TRMNL_POLLER_KEY }}
        run: go run ./cmd/push-templates

  # Render each template with its fixture through TRMNL's render-markup
  # endpoint. A "Liquid error" fails the job. It uses no poller key and
  # sends no settings.yml. A fork has no secrets, so the tool skips there.
  render:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install the trmnl CLI
        run: |
          go install github.com/usetrmnl/cli/cmd/trmnl@v0.1.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The tool also writes a PNG when google-chrome is on the runner.
      - name: Render the templates
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
        run: go run ./cmd/push-templates --render "$RUNNER_TEMP/rendered"

      - name: Upload the rendered output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-templates
          path: ${{ runner.temp }}/rendered
          if-no-files-found: ignore
          retention-days: 1
