# trmnl-poller configuration. Copy to /etc/trmnl-poller/config.yml, or pass
# --config <path>. The file is optional: a missing file means every default
# below. A key you leave out keeps its default. A key you set replaces its
# default. The list must name at least one holiday: "holidays: []" is
# refused, so the screen never has an empty column.
#
# Secrets and URLs are NOT in this file. Set them in the environment:
#   TRMNL_POLLER_KEY   required; at least 32 characters; letters, digits,
#                      "-" and "_" only; the value TRMNL sends in the
#                      X-Poller-Key header
#   TRIPIT_ICAL_URL    optional; the TripIt iCal feed; an https URL; no URL,
#                      no trips
#   SCHOOL_ICAL_URL    optional; the school calendar iCal feed; an https URL;
#                      no URL, no school events
#   INFLUX_URL         optional; the InfluxDB 2 base URL, http or https; no
#                      URL, no solar screens (the solar paths answer 404)
#   INFLUX_TOKEN       required when INFLUX_URL is set; a read-only token

# Address the HTTP server listens on. The container image and the health
# check use port 8790.
listen: ":8790"

# IANA time zone. Every day count uses calendar dates in this zone.
timezone: America/New_York

# Name shown for the school column.
school_label: School

# Which school calendar events to keep. Each entry is a regular expression,
# matched without regard to case. An event that matches an exclude pattern
# is dropped, even when it matches an include pattern.
school_rules:
  include:
    - '^Residence halls close'
    - '^No classes \(.*break\)'
    - '^Classes begin'
    - '^Last day of classes'
    - '^Commencement'
  exclude:
    - 'winter session'

# Holidays that can fill a column. Allowed keys: new_years, mlk, presidents,
# good_friday, memorial, juneteenth, independence, labor, thanksgiving,
# christmas, halloween.
holidays:
  - new_years
  - mlk
  - presidents
  - good_friday
  - memorial
  - juneteenth
  - independence
  - labor
  - thanksgiving
  - christmas
  - halloween

# InfluxDB 2 organization and bucket for the solar screens. The field is
# always "value".
influx:
  org: bellmore
  bucket: home_assistant/autogen

# Solar screens. Each entity ID names a Home Assistant entity in the bucket.
# An ID may hold only a-z, 0-9 and "_". A key you leave out keeps its default.
solar:
  # A grid reading at or below this many kW counts as net zero.
  net_zero_kw: 0.05
  entities:
    solar_kw: bellmore_solar_power
    grid_kw: bellmore_grid_power
    load_kw: bellmore_load_power
    car_kw: wall_connector_power
    charge_pct: bellmore_percentage_charged
    reserve_pct: bellmore_backup_reserve
    solar_kwh: bellmore_solar_generated
    home_kwh: bellmore_home_usage
    grid_in_kwh: bellmore_grid_imported
    grid_out_kwh: bellmore_grid_exported

# Where the sun markers go on the Solar Today chart. Set both or neither.
# With neither, the chart has no sun markers. Use your own coordinates in
# decimal degrees on the host. Never commit them.
# latitude: <your latitude>
# longitude: <your longitude>
